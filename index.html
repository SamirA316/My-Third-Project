<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, there</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="page-header">
      <h1 id="greeting">Hello</h1>
    </header>

    <section class="box-grid" aria-label="Color boxes">
      <button class="color-box red" type="button" data-color="red" aria-label="Set background to red">
        <span>Red</span>
      </button>
      <button class="color-box blue" type="button" data-color="blue" aria-label="Set background to blue">
        <span>Blue</span>
      </button>
      <button class="color-box green" type="button" data-color="green" aria-label="Set background to green">
        <span>Green</span>
      </button>
      <button class="color-box yellow" type="button" data-color="yellow" aria-label="Set background to yellow">
        <span>Yellow</span>
      </button>
    </section>

    <form class="greeting-form" id="greetingForm">
      <label class="sr-only" for="name">Your name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" autocomplete="name">
      <button type="submit">Greet</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
